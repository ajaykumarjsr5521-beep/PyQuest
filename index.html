<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PyQuest · Learn Python free</title>
<meta name="description" content="A free, hands-on Python course that runs entirely in your browser. Write real code, get instant feedback.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--PQ:BODY-->
<header class="topbar">
  <button class="icon-btn" id="menu-btn" aria-label="Show lessons"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  <a class="brand" href="#">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="8" fill="var(--accent)"/><path d="M10 11.5l5 4.5-5 4.5" fill="none" stroke="var(--accent-ink)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 21h6" stroke="var(--sun)" stroke-width="2.6" stroke-linecap="round"/></svg>
    <span class="brand-name">PyQuest</span>
  </a>
  <div class="top-stats">
    <span class="chip status" id="py-status" data-state="loading"><i></i><span>Loading Python…</span></span>
    <span class="chip chip-xp" title="Experience points"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z" fill="currentColor"/></svg><span id="stat-xp">0</span> <small>XP</small></span>
    <span class="chip chip-level"><small>Lv</small> <span id="stat-level">1</span></span>
    <span class="chip" title="Days in a row with a solved lesson"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 4 5 5.5 5 11a5 5 0 0 1-10 0c0-2.5 1.2-4 2.5-5 .2 2 1 3 2 3.5C11 9 10.5 5.5 12 2z" fill="var(--bad)"/></svg><span id="stat-streak">0</span></span>
    <button class="icon-btn" id="theme-btn" aria-label="Switch light or dark theme"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" fill="currentColor"/></svg></button>
  </div>
</header>
<div class="shell">
  <aside class="side" aria-label="Lessons"><nav id="lesson-nav"></nav></aside>
  <div id="scrim"></div>
  <main id="main" tabindex="-1"></main>
</div>
<!--PQ:/BODY-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/runmode/runmode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/comment/comment.min.js"></script>
<script src="lessons.js"></script>
<script src="app.js"></script>
</body>
</html>
